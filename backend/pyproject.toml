[project]
name = "pocket-producer"
version = "0.1.0"
description = "Agentic memory system for music creation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-adk>=1.25.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.114.0",
    "google-cloud-speech>=2.25.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-secret-manager>=2.21.0",
    "voyageai>=0.3.0",
    "pymongo>=4.10.0",
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "api*", "jobs*", "services*"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "httpx", "python-dotenv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E501"]
"tests/seed_30_fragments.py" = ["E501"]
"tests/seed_real_lyrics.py" = ["E402", "E501"]
"tests/seed_fma_audio.py" = ["E402", "E501"]
"tests/download_fma_tracks.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
