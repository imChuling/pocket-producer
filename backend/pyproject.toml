[project]
name = "pocket-producer"
version = "0.1.0"
description = "Agentic memory system for music creation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-adk>=1.25.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.114.0",
    "google-cloud-speech>=2.25.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-secret-manager>=2.21.0",
    "voyageai>=0.3.0",
    "pymongo>=4.10.0",
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "requests>=2.31.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
research = [
    "torch>=2.6,<3",
    "transformers>=4.53,<5",
    "sentence-transformers>=5,<6",
    "safetensors>=0.5,<1",
    "msclap>=1.3,<2",
    "soundfile>=0.12,<1",
    "torchcodec>=0.15,<1",
    "laion-clap>=1.1,<2",
    "torchvision>=0.20,<1",
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "api*", "jobs*", "ranking*"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "httpx", "python-dotenv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
