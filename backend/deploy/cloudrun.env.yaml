# Non-secret environment for the Cloud Run service `pocket-producer`.
#
# Secrets (MONGODB_CONNECTION_STRING, VOYAGE_API_KEY, GOOGLE_API_KEY,
# JOB_TRIGGER_SECRET) are bound with --update-secrets in deploy.sh and are
# NOT listed here. HF_HUB_OFFLINE and HF_HOME are baked into the Dockerfile.
#
# Why this file exists: a `gcloud run deploy` that passes --set-env-vars (or
# none) replaces the whole env block, and on 2026-10-18 that silently dropped
# every variable below, breaking uploads (KeyError: GCS_BUCKET) for 12 days.
# Always deploy through deploy.sh so this file is the single source of truth.
GCS_BUCKET: pocket-producer-audio
GOOGLE_CLOUD_PROJECT: pocket-producer-ce3e9
GOOGLE_CLOUD_LOCATION: global
GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
SIMILARITY_THRESHOLD: "0.55"
TAGGING_MODEL: gemini-3.1-flash-lite
TAGGING_MODEL_AUDIO: gemini-3-flash-preview
PRODUCER_MODEL: gemini-3-flash-preview
MEMORY_MODEL: gemini-3-flash-preview
MAX_CONCURRENT_PIPELINES: "2"
MCP_SERVER_URL: https://mongodb-mcp-tisfdl6pbq-uc.a.run.app/mcp
ENABLE_MCP_MEMORY_TOOLS: "1"
POCKET_ENABLE_CLAP: "1"
# Per-user daily allowance for LLM-backed actions (/ingest, /intent). An
# Audiotool project import counts one ingest per sample.
POCKET_DAILY_LLM_QUOTA: "200"
