name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system pytest "ruff==0.16.10" httpx python-dotenv
      - name: Ruff lint
        run: ruff check .
      # torch is a research-only dependency; tests that need it skip themselves
      # (see tests/conftest.py) so this job covers the deployed surface.
      - name: Tests
        run: pytest tests/ -q --tb=short

  research-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.10"
      - name: Ruff lint
        run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # pnpm applies patches/ to @audiotool/nexus; npm would skip them.
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm exec eslint src && pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm exec vitest run
      # Firebase initialises at import, so the build needs a web config even
      # though nothing is called; placeholders keep a broken build out of Vercel.
      - name: Production build
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_AUDIOTOOL_CLIENT_ID: ci-placeholder

  paper-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The paper source (docs/ismir2026/) may be kept out of the public tree;
      # the artifact-side assertions still run, the tex presence checks skip.
      - run: python research/check_paper_numbers.py
